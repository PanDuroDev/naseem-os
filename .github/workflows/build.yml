name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "build/**"
      - "config/**"
      - ".github/workflows/build.yml"

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/graalvm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf parted dosfstools e2fsprogs rsync zstd curl imagemagick
          df -h /

      - name: Build image
        run: sudo -E bash build/build.sh

      - name: Smoke test
        run: bash build/smoke.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: naseem-image
          path: release/
          retention-days: 14
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Naseem $GITHUB_REF_NAME" --notes "Built from $GITHUB_SHA"
          gh release upload "$GITHUB_REF_NAME" release/* --clobber