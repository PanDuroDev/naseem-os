# Naseem lock screen - hyprlock
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/nasim/Pictures/wallpaper.png
    color = rgba(20, 20, 24, 0.55)
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 260, 46
    position = 0, -60
    halign = center
    valign = center
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.28)
    inner_color = rgba(28, 28, 32, 0.78)
    font_color = rgb(242, 242, 247)
    placeholder_text = Password
    dots_size = 0.22
    dots_spacing = 0.4
    fade_on_empty = false
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.92)
    font_size = 64
    font_family = Inter
    position = 0, 140
    halign = center
    valign = center
}
