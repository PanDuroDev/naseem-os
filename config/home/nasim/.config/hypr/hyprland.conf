# Naseem desktop - Hyprland, macOS flavour
monitor=,preferred,auto,1

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 1
    col.active_border = rgba(ffffff59)
    col.inactive_border = rgba(ffffff00)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.97
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000055)
    }
}

animations {
    enabled = true
    bezier = naseem, 0.25, 0.1, 0.25, 1.0
    animation = windows, 1, 5, naseem
    animation = windowsOut, 1, 5, naseem, popin 80%
    animation = fade, 1, 5, naseem
    animation = workspaces, 1, 5, naseem
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    focus_on_activate = true
}

exec-once = swaybg -i /home/nasim/Pictures/wallpaper.png -m fill
exec-once = waybar
exec-once = nwg-dock-hyprland -i 44 -d -p bottom -mb 8

bind = SUPER, RETURN, exec, kitty
bind = SUPER, SPACE, exec, fuzzel
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen
bind = SUPER SHIFT, Q, exit
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow